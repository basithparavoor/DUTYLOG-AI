<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1730">
<meta name="description" content="DUTYLOG AI — Daily Duty Report & Institutional Work Journal">
<title>DUTYLOG AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/docx@9.5.1/build/index.js"></script>
</head>
<body>
<div id="toastHost"></div>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="brand-mark">D</div>
    <div><strong>DUTYLOG</strong><span>AI</span><small>Daily Duty Journal</small></div>
  </div>
  <nav>
    <button data-view="dashboard" class="nav-item active"><i>⌂</i>Dashboard</button>
    <button data-view="calendar" class="nav-item"><i>▦</i>Calendar</button>
    <button data-view="reports" class="nav-item"><i>▤</i>Daily Reports</button>
    <button data-view="generator" class="nav-item"><i>✦</i>Report Generator</button>
    <button data-view="monthly" class="nav-item"><i>▣</i>Monthly Reports</button>
    <button data-view="analytics" class="nav-item"><i>◔</i>Analytics</button>
    <button data-view="leave" class="nav-item"><i>◷</i>Holidays & Leave</button>
    <button data-view="settings" class="nav-item"><i>⚙</i>Settings</button>
  </nav>
  <div class="sidebar-footer">
    <div class="mini-profile"><div class="avatar">MB</div><div><b id="sideName">Muhammad Basith Adany</b><small>Institutional Journal</small></div></div>
  </div>
</aside>

<div class="app-shell">
<header class="topbar">
  <button class="icon-btn mobile-only" id="menuBtn">☰</button>
  <div class="crumb"><span id="viewKicker">Overview</span><b id="viewTitle">Dashboard</b></div>
  <div class="top-actions">
    <button class="icon-btn" id="themeBtn" title="Theme">◐</button>
    <button class="icon-btn" id="todayBtn" title="Today">Today</button>
    <button class="avatar top-avatar">MB</button>
  </div>
</header>

<main id="main"></main>

<nav class="bottom-nav">
  <button data-view="dashboard" class="active">⌂<span>Home</span></button>
  <button data-view="calendar">▦<span>Calendar</span></button>
  <button data-view="reports">▤<span>Reports</span></button>
  <button data-view="analytics">◔<span>Analytics</span></button>
  <button data-view="settings">⚙<span>Settings</span></button>
</nav>
</div>

<div class="fab-wrap"><button id="quickFab" class="fab">＋</button><span>Quick report</span></div>

<div class="modal-backdrop" id="modalBackdrop">
  <section class="modal" id="modal"></section>
</div>

<script src="storage.js"></script>
<script src="ai.js"></script>
<script src="export.js"></script>
<script src="analytics.js"></script>
<script src="calendar.js"></script>
<script src="reports.js"></script>
<script src="settings.js"></script>
<script src="drive.js"></script>
<script src="app.js"></script>
</body>
</html>
